<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
<title id="title">Actions &amp; input</title><desc id="desc">Buttons, fields, checkboxes, slider, color input, editable title, growing text and 34 pixel compatibility variants.</desc>
