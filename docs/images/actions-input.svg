<text x="31" y="334" font-size="13" fill="#27272a" font-weight="400">✓</text>
<text x="56" y="334" font-size="13" fill="#27272a" font-weight="400">Enabled</text>
<rect x="188" y="316" width="156" height="32" rx="6" fill="#ffffff" stroke="#d4d4d8"/>
<rect x="197" y="323" width="18" height="18" rx="3" fill="#52525b" stroke="#d4d4d8"/>
